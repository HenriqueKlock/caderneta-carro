name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dados dos postos (branch dados)
        run: |
          mkdir -p public/dados
          if git ls-remote --exit-code --heads origin dados >/dev/null; then
            git fetch --depth=1 origin dados
            for f in $(git ls-tree --name-only FETCH_HEAD | grep -E '^postos-.*\.json$'); do git show "FETCH_HEAD:$f" > "public/dados/$f"; done
          fi
          ls -la public/dados
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Segurança (caixa preta, só com o que é público)
        run: node tests/blackbox.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
